     진행 링은 12시에서 시계방향으로 황금비 1/phi = 61.803 퍼센트 (222.49도) 만큼 채운다.
     남은 트랙과 채운 호의 비가 phi 가 된다. 비디오 앱이므로 '재생 중'을 뜻하기도 한다.

     색: 크림 판 / 청록 마크 / 금색 글씨.
       금색 #9A6B12 는 크림 위 대비 3.80:1 이다. 원래 브랜드 노랑 #FEDD59 는
       같은 바탕에서 1.09:1 이라 읽히지 않아 농도만 내렸다.
     글꼴: Space Grotesk Bold, 자간 14. OFL 이라 상업적 사용에 제약이 없다. -->
  <defs>
    <radialGradient id="plate" cx="0.32" cy="0.2" r="1">
      <stop offset="0" stop-color="#F9F6EF"/><stop offset="1" stop-color="#DED5C3"/></radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="disc"><circle cx="512" cy="430" r="199"/></clipPath>
  </defs>
