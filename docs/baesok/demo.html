<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>자료구조 3강 · 해시 테이블</title>
  <!-- 배속 확장 시험용 가상의 강의 페이지(심사·스크린샷용). 실제 서비스·상표를 흉내 내지 않는다. -->
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light; --ink:#1C1C1E; --sub:#6B6B70; --line:#E9E6E3; --accent:#FF5A36; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink);
           font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 14px 18px; font-weight: 800; font-size: 18px; }
    header .dot { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg,#2EC5CE,#7B61FF); }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    main { padding: 16px 18px 120px; }
    .course { color: var(--accent); font-weight: 700; font-size: 14px; }
    h1 { font-size: 22px; line-height: 1.3; margin: 4px 0 6px; letter-spacing: -0.02em; }
    .meta { color: var(--sub); font-size: 14px; }
    .bar { height: 4px; border-radius: 2px; background: var(--line); margin: 14px 0 18px; overflow: hidden; }
    .bar i { display: block; width: 38%; height: 100%; background: var(--accent); }
    h2 { font-size: 16px; margin: 20px 0 8px; }
    ol { list-style: none; padding: 0; margin: 0; }
    li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    li b { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 48px; font-weight: 600; }
    li.now { font-weight: 700; }
    p { color: var(--sub); }
  </style>
</head>
<body>
  <header><span class="dot"></span>스터디노트</header>
  <video src="demo.mp4" autoplay muted loop playsinline></video>
  <main>
    <div class="course">자료구조 기초 · 3강</div>
    <h1>해시 테이블 한 번에 이해하기</h1>
    <div class="meta">42분 18초 · 조회수 1.2만회</div>
    <div class="bar"><i></i></div>
    <h2>목차</h2>
    <ol>
      <li><b>00:00</b>해시 함수란 무엇인가</li>
      <li class="now"><b>08:30</b>충돌 해결 ① 체이닝</li>
      <li><b>21:10</b>충돌 해결 ② 개방 주소법</li>
      <li><b>33:40</b>실전 문제 풀이</li>
    </ol>
    <p>키를 해시 함수로 바꿔 버킷에 바로 찾아가는 원리부터, 충돌을 다루는 두 가지 방법과 실전 문제까지.</p>
  </main>
</body>
</html>
