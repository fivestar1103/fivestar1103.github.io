<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="referrer" content="no-referrer">
<link id="canonical" rel="canonical" href="https://kuiperbelt.site/">
<title>Kuiper Belt — moved</title>
<script>
  // Concatenation keeps even a pathname beginning with // on the fixed origin.
  const destination = 'https://kuiperbelt.site' + location.pathname + location.search + location.hash;
  document.getElementById('canonical').href = 'https://kuiperbelt.site' + location.pathname;
  location.replace(destination);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://kuiperbelt.site/"></noscript>
</head>
<body>
<p><a id="destination" href="https://kuiperbelt.site/">Continue to Kuiper Belt</a></p>
<script>document.getElementById('destination').href = destination;</script>
</body>
</html>
